<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avaliação">
<meta name="theme-color" content="#2E2C7A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna para celular — barra superior com a marca, conteúdo rolável, abas fixas embaixo. O relatório é uma "folha" clara de 420px, igual em qualquer tema, pronta para virar imagem/PDF. */
:root{
  --bg:#F4F4F9; --surface:#FFFFFF; --surface2:#ECEBF5; --fg:#1C1B3A; --muted:#66658A; --line:#DFDEEC;
  --indigo:#2E2C7A; --magenta:#C42B7C; --sky:#4FB0D8;
  --ok:#1E8E62; --warn:#B87400; --bad:#C93434; --okbg:#E3F4EC; --warnbg:#FBF0DC; --badbg:#FBE5E5;
  --focus:#C42B7C;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* folha do relatório: sempre clara */
  --r-bg:#FFFFFF; --r-fg:#1C1B3A; --r-muted:#6B6A8C; --r-line:#E6E5F0; --r-soft:#F5F4FA;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121128; --surface:#1C1B38; --surface2:#26254A; --fg:#EDEDF7; --muted:#A3A2C4; --line:#2F2E55;
  --indigo:#9C9AF2; --magenta:#E45BA0; --sky:#6CC4E8;
  --ok:#4CC793; --warn:#E3A93A; --bad:#EE6B6B; --okbg:#173A2E; --warnbg:#3B2E12; --badbg:#3E1C22; --focus:#E45BA0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121128; --surface:#1C1B38; --surface2:#26254A; --fg:#EDEDF7; --muted:#A3A2C4; --line:#2F2E55;
  --indigo:#9C9AF2; --magenta:#E45BA0; --sky:#6CC4E8;
  --ok:#4CC793; --warn:#E3A93A; --bad:#EE6B6B; --okbg:#173A2E; --warnbg:#3B2E12; --badbg:#3E1C22; --focus:#E45BA0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo-pill{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center}
.logo-pill img{height:30px;width:auto;display:block}
.top-title{flex:1;min-width:0}
.top-title h1{font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;border:0;cursor:pointer;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--magenta)}
.tab.cta svg{background:var(--magenta);color:#fff;border-radius:50%;padding:3px;width:28px;height:28px;margin-top:-4px}
/* generic */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.indigo{background:var(--indigo);border-color:var(--indigo);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--magenta);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warnbg);color:var(--fg)} .banner.warn b{color:var(--warn)}
.banner.bad{background:var(--badbg)} .banner.bad b{color:var(--bad)}
.banner.ok{background:var(--okbg)} .banner.ok b{color:var(--ok)}
.banner.info{background:var(--surface2)}
/* search + list */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--bg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.li:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;background:var(--surface2);color:var(--indigo)}
.li-main{flex:1;min-width:0}
.li-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.li-main span{font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn)} .tag.ok{background:var(--okbg);color:var(--ok)} .tag.bad{background:var(--badbg);color:var(--bad)} .tag.n{background:var(--surface2);color:var(--muted)}
/* aluno */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dl.meta dt{color:var(--muted)} dl.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* form */
.fgroup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}
.inp{position:relative;display:flex;align-items:center}
.inp input,.inp select,.field textarea,.field select,.field > input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px}
.inp input{padding-right:48px}
.inp .u{position:absolute;right:12px;font-size:13px;color:var(--muted);pointer-events:none}
.field .hint{font-size:12px;color:var(--muted)}
.field.err input{border-color:var(--bad)} .field .msg{font-size:12px;color:var(--bad)}
.field.warnf input{border-color:var(--warn)} .field.warnf .msg{color:var(--warn)}
textarea{resize:vertical;min-height:110px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.toggles{display:grid;gap:8px}
.tg{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.tg input{width:20px;height:20px;accent-color:var(--magenta)}
.sticky-actions{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);padding-top:14px;display:flex;gap:10px}
.sticky-actions .btn{flex:1}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,10,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
/* ===== relatório (folha clara) ===== */
.rpt-wrap{display:flex;justify-content:center}
.rpt{width:100%;max-width:420px;background:var(--r-bg);color:var(--r-fg);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(20,20,60,.12);font-family:var(--f-body)}
.rpt .num{font-variant-numeric:tabular-nums}
.r-head{padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--r-line)}
.r-head img{height:44px;width:auto}
.r-head .r-date{text-align:right;font-size:12px;color:var(--r-muted)}
.r-head .r-date b{display:block;font-family:var(--f-display);font-size:18px;color:#2E2C7A}
.r-band{background:#2E2C7A;color:#fff;padding:16px 18px}
.r-band h2{font-size:24px;line-height:1.1}
.r-band p{margin:4px 0 0;font-size:13px;opacity:.85}
.r-sec{padding:16px 18px;border-bottom:1px solid var(--r-line)}
.r-sec:last-child{border-bottom:0}
.r-sec h3{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:#C42B7C;margin-bottom:10px;font-family:var(--f-body);font-weight:700}
.r-lead{font-size:15px;line-height:1.5;margin:0}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r-k{background:var(--r-soft);border-radius:10px;padding:10px 11px;min-width:0}
.r-k .l{font-size:11.5px;color:var(--r-muted);font-weight:600}
.r-k .v{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.15;color:#1C1B3A}
.r-k .v small{font-size:13px;color:var(--r-muted);font-weight:600}
.r-k .dl{font-size:11.5px;color:var(--r-muted)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-top:3px;letter-spacing:.02em}
.p-ok{background:#E1F3EA;color:#17734F} .p-warn{background:#FBEFD8;color:#8F5A00} .p-bad{background:#FADFDF;color:#A82828} .p-good{background:#E2ECFA;color:#24539E} .p-n{background:#EEEDF5;color:#5B5A7A}
.r-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0}
.r-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--r-muted)}
.r-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.r-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.r-tbl th{font-size:11px;color:var(--r-muted);font-weight:600;text-align:right;padding:4px 4px 6px}
.r-tbl th:first-child{text-align:left}
.r-tbl td{padding:6px 4px;border-top:1px solid var(--r-line);text-align:right}
.r-tbl td:first-child{text-align:left;color:var(--r-fg)}
.r-tbl .dlt{font-weight:700}
.r-note{font-size:12px;color:var(--r-muted);margin:8px 0 0}
.r-quote{font-size:15px;line-height:1.55;white-space:pre-wrap;margin:0;border-left:3px solid #C42B7C;padding-left:12px}
.r-foot{background:var(--r-soft);padding:12px 18px;font-size:11.5px;color:var(--r-muted);display:flex;justify-content:space-between;gap:8px}
.r-chart text{fill:#6B6A8C}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<script>
"use strict";
/* ================== DADOS & REFERÊNCIAS ================== */
const SCHEMA=1, APPKEY='avaliacao-saude-com-personal';
const BAL=[
 {k:'peso',l:'Peso',u:'kg',min:25,max:250,dec:1,jump:.08},
 {k:'gorduraPct',l:'Gordura corporal',u:'%',min:3,max:65,dec:1,jumpAbs:5},
 {k:'musculoPct',l:'Músculo esquelético',u:'%',min:10,max:60,dec:1,jumpAbs:5},
 {k:'visceral',l:'Gordura visceral',u:'nível',min:1,max:40,dec:1,jumpAbs:4},
 {k:'metabolismo',l:'Metabolismo basal',u:'kcal',min:700,max:4000,dec:0,jump:.15},
 {k:'idadeCorporal',l:'Idade corporal',u:'anos',min:10,max:100,dec:0,jumpAbs:12},
];
const MED=[
 {k:'bracoD',l:'Braço dir.',p:'Braços'},{k:'bracoE',l:'Braço esq.',p:'Braços'},
 {k:'torax',l:'Tórax'},{k:'estomago',l:'Estômago'},{k:'cintura',l:'Cintura'},{k:'abdomen',l:'Abdômen'},{k:'quadril',l:'Quadril'},
 {k:'coxaD',l:'Coxa dir.'},{k:'coxaE',l:'Coxa esq.'},{k:'pernaD',l:'Perna dir.'},{k:'pernaE',l:'Perna esq.'},
 {k:'pantD',l:'Panturrilha dir.'},{k:'pantE',l:'Panturrilha esq.'}
].map(m=>Object.assign({u:'cm',min:15,max:170,dec:1,jumpAbs:6},m));
MED.find(m=>m.k==='bracoD').max=60;MED.find(m=>m.k==='bracoE').max=60;
const COND=[
 {k:'jejum',l:'Sem refeição pesada nas últimas 2 h'},
 {k:'semTreino',l:'Sem treino intenso nas últimas 12 h'},
 {k:'hidratado',l:'Hidratação normal (sem excesso nem desidratação)'},
 {k:'horario',l:'Horário parecido com o da última avaliação'}
];
// Faixas de referência (aba "Apoio" da planilha — tabelas da balança)
const REF_G={F:[[39,[21,33,39]],[59,[23,34,40]],[200,[24,36,42]]],M:[[39,[8,20,25]],[59,[11,22,28]],[200,[13,25,30]]]};
const REF_M={F:[[39,[24.3,30.4,35.4]],[59,[24.1,30.2,35.2]],[200,[23.9,30,35]]],M:[[39,[33.3,39.4,44.1]],[59,[33.1,39.2,43.9]],[200,[32.9,39,43.7]]]};
function band(tbl,sexo,idade,v){ if(v==null||!sexo||!tbl[sexo])return null; const a=idade??30; const cut=tbl[sexo].find(r=>a<=r[0])[1]; return v<cut[0]?0:v<cut[1]?1:v<cut[2]?2:3; }
function clsGordura(sexo,idade,v){const b=band(REF_G,sexo,idade,v);return b==null?null:[['Baixo','warn'],['Normal','ok'],['Alto','warn'],['Muito alto','bad']][b];}
function clsMusculo(sexo,idade,v){const b=band(REF_M,sexo,idade,v);return b==null?null:[['Baixo','warn'],['Normal','ok'],['Alto','good'],['Muito alto','good']][b];}
function clsVisceral(v){if(v==null)return null;return v<10?['Normal','ok']:v<15?['Alto','warn']:['Muito alto','bad'];}
function clsIMC(v){if(v==null)return null;return v<18.5?['Abaixo do peso','warn']:v<25?['Saudável','ok']:v<30?['Sobrepeso','warn']:v<35?['Obesidade I','bad']:v<40?['Obesidade II','bad']:['Obesidade III','bad'];}
function clsCintura(sexo,v){if(v==null||!sexo)return null;const [a,b]=sexo==='F'?[80,88]:[94,102];return v<a?['Adequada','ok']:v<b?['Risco aumentado','warn']:['Risco muito aumentado','bad'];}
function clsRCQ(sexo,v){if(v==null||!sexo)return null;return v<=(sexo==='F'?.85:.90)?['Adequada','ok']:['Risco aumentado','warn'];}
function clsRCE(v){if(v==null)return null;return v<.5?['Adequada','ok']:v<.6?['Risco aumentado','warn']:['Risco alto','bad'];}

/* ================== ARMAZENAMENTO ================== */
const store={
  db:null, mem:{},
  async open(){ try{ this.db=await new Promise((res,rej)=>{const r=indexedDB.open('saude-personal-aval',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}); }catch(e){ this.db=null; } },
  async get(k){ if(!this.db)return this.mem[k]; try{return await new Promise((res,rej)=>{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}catch(e){return this.mem[k];} },
  async set(k,v){ this.mem[k]=v; if(!this.db)return; try{await new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}catch(e){} },
  async del(k){ delete this.mem[k]; if(!this.db)return; try{await new Promise((res)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=res;tx.onerror=res;});}catch(e){} },
  async keys(){ if(!this.db)return Object.keys(this.mem); try{return await new Promise((res)=>{const t=this.db.transaction('kv').objectStore('kv').getAllKeys();t.onsuccess=()=>res(t.result);t.onerror=()=>res([]);});}catch(e){return [];} }
};
let D=null;            // base em uso
let META={lastBackup:null,changes:0,demo:false};
let persisted=null;
async function saveAll(markChange=true){
  if(markChange){META.changes++;}
  D.atualizadoEm=new Date().toISOString();
  await store.set('db',D); await store.set('meta',META); updateChip();
}
async function snapshot(reason){
  const k='snap:'+Date.now(); await store.set(k,{reason,at:new Date().toISOString(),data:JSON.parse(JSON.stringify(D))});
  const ks=(await store.keys()).filter(x=>String(x).startsWith('snap:')).sort();
  while(ks.length>8){await store.del(ks.shift());}
}

/* ================== UTILIDADES ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=1)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fdate=iso=>{if(!iso)return '–';const [y,m,d]=iso.split('-');return `${d}/${m}/${y.slice(2)}`;};
const fdateL=iso=>{if(!iso)return '–';return new Date(iso+'T12:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const days=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const parseNum=s=>{if(s==null)return null;s=String(s).trim().replace(/\s/g,'').replace(',','.');if(s==='')return null;const n=Number(s);return isFinite(n)?n:NaN;};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const initials=n=>n.split(' ').filter(w=>w.length>2||/^[A-Z]/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const firstName=n=>(n||'').trim().split(' ')[0];
function idadeEm(al,iso){ if(al.nascimento){const b=new Date(al.nascimento+'T12:00'),d=new Date((iso||today())+'T12:00');let a=d.getFullYear()-b.getFullYear();if(d<new Date(d.getFullYear(),b.getMonth(),b.getDate(),12))a--;return a;} return al.idadeInformada??null; }
function idadeTxt(al){const a=idadeEm(al);return a==null?'idade não informada':(al.nascimento?`${a} anos`:`~${a} anos`);}
const alunoById=id=>D.alunos.find(a=>a.id===id);
const avsOf=id=>D.avaliacoes.filter(v=>v.alunoId===id).sort((a,b)=>a.data<b.data?-1:1);
function imcOf(av,al){ if(av.peso&&al&&al.alturaCm) return av.peso/((al.alturaCm/100)**2); return av.imcBalanca??null; }
function pendencias(al){ const p=[]; if(!al.nascimento)p.push('data de nascimento'); if(!al.sexo)p.push('sexo'); if(!al.alturaCm)p.push('altura'); if(al.telefone&&al.telefone.replace(/\D/g,'').length<10)p.push('telefone sem DDD'); return p; }
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function sheet(html,onMount){const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet fade" role="dialog" aria-modal="true">${html}</div>`;s.addEventListener('click',e=>{if(e.target===s)s.remove();});document.body.appendChild(s);onMount&&onMount(s.firstElementChild,()=>s.remove());return s;}
function confirmSheet({title,body,ok='Confirmar',danger=false}){return new Promise(res=>{sheet(`<div class="stack"><h2 style="font-size:22px">${title}</h2><div class="muted">${body}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-x>Cancelar</button><button class="btn ${danger?'danger':'primary'}" data-ok>${ok}</button></div></div>`,(el,close)=>{el.querySelector('[data-x]').onclick=()=>{close();res(false)};el.querySelector('[data-ok]').onclick=()=>{close();res(true)};});});}

/* entregar arquivo: compartilhar (iPhone) → capacidade downloads (Claude) → link */
let dlCap=null; (async()=>{try{if(window.claude&&claude.use){dlCap=await claude.use('downloads');}}catch(e){}})();
async function deliver(blob,filename,mime){
  try{ const f=new File([blob],filename,{type:mime}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); return true; } }catch(e){ if(e&&e.name==='AbortError')return false; }
  if(dlCap){ try{ await dlCap.save({filename,data:blob}); return true; }catch(e){ if(e&&e.code==='declined')return false; } }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); return true; }catch(e){ toast('Este navegador não permitiu salvar o arquivo.'); return false; }
}

/* ================== GRÁFICO SVG ================== */
function lineChart(series,{h=170,w=640,unit='',dec=1,light=false}={}){
  const pts=series.flatMap(s=>s.data.map(p=>p.y)).filter(v=>v!=null);
  const n=Math.max(...series.map(s=>s.data.length));
  if(pts.length<1||n<1) return `<p class="muted small">Sem dados suficientes para o gráfico.</p>`;
  let lo=Math.min(...pts),hi=Math.max(...pts); if(hi-lo<1){lo-=1;hi+=1;} const pad=(hi-lo)*.15; lo-=pad;hi+=pad;
  const L=44,R=14,T=12,B=26,iw=w-L-R,ih=h-T-B;
  const X=i=>L+(n===1?iw/2:i*iw/(n-1)), Y=v=>T+ih-(v-lo)/(hi-lo)*ih;
  const tc=light?'#6B6A8C':'var(--muted)', gc=light?'#ECEBF4':'var(--line)';
  let g=''; for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;const y=Y(v);g+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="${gc}" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="${tc}">${fmt(v,dec===0?0:(hi-lo>20?0:1))}</text>`;}
  const dates=series[0].data.map(p=>p.x); const ticks=n<=1?[0]:n<=4?[...Array(n).keys()]:[0,Math.round((n-1)/2),n-1];
  ticks.forEach(i=>{g+=`<text x="${X(i)}" y="${h-6}" text-anchor="${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'}" font-size="11" fill="${tc}">${fdate(dates[i])}</text>`;});
  let s='';
  series.forEach(se=>{ const P=se.data.map((p,i)=>p.y==null?null:[X(i),Y(p.y)]); let d='',on=false; P.forEach(q=>{if(!q){on=false;return;} d+=(on?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);on=true;});
    if(series.length===1){const v=P.filter(Boolean);if(v.length>1)s+=`<path d="M${v[0][0]} ${T+ih}L${v.map(q=>q.join(' ')).join('L')}L${v[v.length-1][0]} ${T+ih}Z" fill="${se.color}" fill-opacity=".10"/>`;}
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    P.forEach((q,i)=>{if(q){const last=i===P.length-1||P.slice(i+1).every(z=>!z);s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${last?4.5:2.6}" fill="${last?se.color:(light?'#fff':'var(--surface)')}" stroke="${se.color}" stroke-width="2"/>`; if(last)s+=`<text x="${Math.min(q[0],w-R-2)}" y="${q[1]-9}" text-anchor="end" font-size="12" font-weight="700" fill="${se.color}">${fmt(se.data[i].y,dec)}${unit}</text>`;}});
  });
  return `<svg class="chart ${light?'r-chart':''}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de evolução">${g}${s}</svg>`;
}
function legend(items,light){return `<div class="${light?'r-legend':'row small muted'}" style="gap:6px 14px">${items.map(([c,l])=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:${c}"></i>${l}</span>`).join('')}</div>`;}

function go(v,p={}){route=Object.assign({v},p);render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.preventDefault();const v=b.dataset.go;go(v,v==='nova'?{}:{});}});
function setTop(t,s){$('#topTitle').textContent=t;$('#topSub').textContent=s||'Barbara Campana';document.title=t==='Avaliações'?'Avaliação Saúde com Personal':t+' · Avaliação';}
function updateChip(){const c=$('#bkChip'),t=$('#bkChipTxt');
  if(META.demo){c.className='chip warn';t.textContent='Dados de exemplo';return;}
  if(!META.lastBackup){c.className='chip bad';t.textContent='Sem backup';return;}
  const dd=days(META.lastBackup.slice(0,10),today());
  if(META.changes>0){c.className=META.changes>=3||dd>7?'chip bad':'chip warn';t.textContent=`Backup pendente · ${META.changes}`;}
  else{c.className='chip ok';t.textContent='Backup em dia';}
}
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.removeAttribute('aria-current'));
  const tabFor={alunos:'alunos',aluno:'alunos',cadastro:'alunos',relatorio:'alunos',nova:'nova',backup:'backup'}[route.v];
  const tb=$('#tab-'+tabFor); tb&&tb.setAttribute('aria-current','page');

  ({alunos:vAlunos,aluno:vAluno,cadastro:vCadastro,nova:vNova,relatorio:vRelatorio,backup:vBackup}[route.v])(app);
  updateChip();
}

/* ================== TELA: ALUNOS ================== */
function vAlunos(app){
  setTop('Avaliações',`${D.alunos.filter(a=>a.ativo!==false).length} alunos · ${D.avaliacoes.length} avaliações`);
  const last={}; D.avaliacoes.forEach(v=>{if(!last[v.alunoId]||v.data>last[v.alunoId].data)last[v.alunoId]=v;});
  const cnt={}; D.avaliacoes.forEach(v=>cnt[v.alunoId]=(cnt[v.alunoId]||0)+1);
  const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const pend=D.alunos.filter(a=>pendencias(a).length).length;
  app.innerHTML=`<div class="stack fade">
   ${META.demo?`<div class="banner warn"><div><b>Você está vendo dados de exemplo.</b> Para usar a base real, vá em <a href="#" data-go="backup">Backup</a> e restaure o arquivo de backup.</div></div>`:''}
   <input class="search" id="q" type="search" placeholder="Buscar aluno" value="${esc(filt.q)}" autocomplete="off" aria-label="Buscar aluno">
   <div class="filters" role="group" aria-label="Filtros">
     ${[['todos','Todos'],['recentes','Avaliados em 90 dias'],['atrasados','Sem avaliação há +90 dias'],['pend',`Cadastro incompleto (${pend})`]].map(([k,l])=>`<button class="fchip" data-f="${k}" aria-pressed="${filt.f===k}">${l}</button>`).join('')}
   </div>
   <div class="list" id="lst"></div>
   <button class="btn block" id="novoAluno">+ Cadastrar aluno</button>
  </div>`;
  const draw=()=>{
    const q=norm(filt.q.trim()); const t=today();
    let arr=D.alunos.filter(a=>!q||norm(a.nome).includes(q));
    if(filt.f==='recentes')arr=arr.filter(a=>last[a.id]&&days(last[a.id].data,t)<=90);
    if(filt.f==='atrasados')arr=arr.filter(a=>last[a.id]&&days(last[a.id].data,t)>90);
    if(filt.f==='pend')arr=arr.filter(a=>pendencias(a).length);
    arr.sort((a,b)=>{const la=last[a.id]?.data||'',lb=last[b.id]?.data||'';return q?a.nome.localeCompare(b.nome):(lb>la?1:lb<la?-1:a.nome.localeCompare(b.nome));});
    $('#lst').innerHTML=arr.length?arr.slice(0,300).map(a=>{const l=last[a.id];const p=pendencias(a).length;
      return `<button class="li" data-al="${a.id}"><span class="av">${esc(initials(a.nome))}</span><span class="li-main"><b>${esc(a.nome)}</b><span>${l?`Última: ${fdate(l.data)} · ${cnt[a.id]} ${cnt[a.id]>1?'avaliações':'avaliação'}`:'Sem avaliação'}</span></span>${p?`<span class="tag warn">Cadastro</span>`:''}</button>`;}).join(''):`<div style="padding:18px" class="muted">Nenhum aluno encontrado.</div>`;
  };
  draw();
  $('#q').addEventListener('input',e=>{filt.q=e.target.value;draw();});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filt.f=b.dataset.f;app.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
  $('#lst').addEventListener('click',e=>{const b=e.target.closest('[data-al]');if(b)go('aluno',{id:b.dataset.al});});
  $('#novoAluno').onclick=()=>go('cadastro',{});
}

  const kp=(l,v,u,dec,k)=>`<div class="kpi"><div class="eyebrow">${l}</div><div class="v num">${fmt(v,dec)}<small> ${u}</small></div><div class="d">${k?dlt(k,dec,u==='%'?' p.p.':' '+u):''}</div></div>`;

      <dt>Altura</dt><dd>${al.alturaCm?fmt(al.alturaCm,0)+' cm':'–'}</dd>
      <dt>Contato</dt><dd>${esc(al.telefone||'–')}${al.email?`<br>${esc(al.email)}`:''}</dd>
    </dl><div class="row" style="margin-top:12px"><button class="btn" id="edit">Editar cadastro</button><button class="btn primary" id="nv">+ Nova avaliação</button></div></div>
    ${lv?`<div class="sec-h"><h2 style="font-size:20px">Última avaliação · ${fdate(lv.data)}</h2><button class="btn ghost" data-rp="${lv.id}">Relatório ›</button></div>
    <div class="kpis">${kp('Peso',lv.peso,'kg',1,'peso')}${kp('Gordura',lv.gorduraPct,'%',1,'gorduraPct')}${kp('Músculo',lv.musculoPct,'%',1,'musculoPct')}${kp('Visceral',lv.visceral,'',0,'visceral')}${kp('IMC',imcOf(lv,al),'',1)}${kp('Cintura',lv.cintura,'cm',1,'cintura')}</div>
    <div class="card stack"><div class="seg" role="group">${[['comp','Peso'],['gord','Gordura × músculo'],['med','Tronco']].map(([k,l])=>`<button data-t="${k}" aria-pressed="${alunoTab===k}">${l}</button>`).join('')}</div><div id="ch"></div></div>

    :`<div class="card"><p style="margin:0">Ainda não há avaliações para ${esc(firstName(al.nome))}.</p></div>`}

  const fx=$('#fix'); if(fx)fx.onclick=e=>{e.preventDefault();go('cadastro',{id:al.id});};

   <div class="row"><button type="button" class="btn ghost" id="back">‹ Voltar</button></div>

    <div class="field"><label for="c-tel">Telefone</label><input id="c-tel" inputmode="tel" value="${esc(al.telefone||'')}" placeholder="(11) 99999-9999"></div>
    <div class="field full"><label for="c-email">E-mail</label><input id="c-email" type="email" value="${esc(al.email||'')}"></div>
    <div class="field full"><label for="c-o1">Objetivo principal</label><input id="c-o1" value="${esc(al.objetivo1||'')}"></div>
    <div class="field full"><label for="c-o2">Objetivo secundário</label><input id="c-o2" value="${esc(al.objetivo2||'')}"></div>
    <div class="field"><label for="c-mp">Meta de peso</label><div class="inp"><input id="c-mp" inputmode="decimal" value="${al.metaPeso??''}"><span class="u">kg</span></div></div>
    <div class="field"><label for="c-mg">Meta de gordura</label><div class="inp"><input id="c-mg" inputmode="decimal" value="${al.metaGordura??''}"><span class="u">%</span></div></div>
    <label class="tg field full" style="flex-direction:row"><input type="checkbox" id="c-ativo" ${al.ativo!==false?'checked':''}> Aluno ativo</label>
   </div>
   <div id="cErr"></div>
   <div class="sticky-actions"><button type="submit" class="btn primary">Salvar cadastro</button></div>
  </form>`;

    if(alt!=null&&!isNaN(alt)&&alt<3)alt=Math.round(alt*1000)/10;
    if(alt!=null&&(isNaN(alt)||alt<50||alt>230))err.push('Altura deve estar em centímetros, entre 50 e 230.');
    const dup=D.alunos.find(a=>a.id!==route.id&&a.nome.toLowerCase()===nome.toLowerCase()); if(dup)err.push(`Já existe um aluno chamado ${esc(dup.nome)}.`);

/* ================== TELA: NOVA / EDITAR AVALIAÇÃO ================== */

    const prev=al?avsOf(al.id).filter(v=>!editing||v.id!==editing.id).filter(v=>!editing||v.data<editing.data).pop():null;
    const val=k=>editing&&editing[k]!=null?String(editing[k]).replace('.',','):'';
    const fld=f=>`<div class="field" data-k="${f.k}"><label for="f-${f.k}">${f.l}</label><div class="inp"><input id="f-${f.k}" inputmode="decimal" autocomplete="off" value="${val(f.k)}" ${!al?'disabled':''}><span class="u">${f.u}</span></div><span class="hint">${prev&&prev[f.k]!=null?`Anterior: ${fmt(prev[f.k],f.dec)}`:'&nbsp;'}</span><span class="msg"></span></div>`;

function checkField(fe,prev){
  const k=fe.dataset.k; const f=[...BAL,...MED].find(x=>x.k===k)||{k,min:10,max:70,dec:1};
  const raw=fe.querySelector('input').value; let v=parseNum(raw); const out={v:null};
  fe.classList.remove('err','warnf'); fe.querySelector('.msg').textContent='';
  if(v==null)return out;
  if(isNaN(v)){out.err='não é um número';}
  else{
    if((k==='gorduraPct'||k==='musculoPct')&&v>0&&v<1)v=Math.round(v*1000)/10; // digitou 0,42 → 42%
    if(v<f.min||v>f.max)out.err=`fora do possível (${f.min}–${f.max} ${f.u||''})`;
    else{ out.v=Math.round(v*10)/10;
      const pv=prev&&prev[k]; if(pv!=null){const d=Math.abs(v-pv); if((f.jump&&d/pv>f.jump)||(f.jumpAbs&&d>f.jumpAbs))out.warn=`mudou ${fmt(d,f.dec)} desde a última (${fmt(pv,f.dec)})`;}
    }
  }
  if(out.err){fe.classList.add('err');fe.querySelector('.msg').textContent=out.err;}
  else if(out.warn){fe.classList.add('warnf');fe.querySelector('.msg').textContent=out.warn;}
  return out;
}

function autoText(av,al){
  const avs=avsOf(al.id); const i=avs.findIndex(v=>v.id===av.id); const pv=i>0?avs[i-1]:null; const nm=firstName(al.nome);
  const imc=imcOf(av,al); const ci=clsIMC(imc);
  if(!pv) return `${nm}, esta é a sua primeira avaliação. Ela é o nosso ponto de partida${ci?` — hoje seu IMC está na faixa “${ci[0]}”`:''}. A partir dela vamos acompanhar sua evolução e ajustar os treinos.`;
  const n=days(pv.data,av.data); const parts=[];
  if(av.peso!=null&&pv.peso!=null){const d=av.peso-pv.peso; parts.push(Math.abs(d)<.1?'manteve o peso':`${d<0?'perdeu':'ganhou'} ${fmt(Math.abs(d))} kg`);}
  if(av.gorduraPct!=null&&pv.gorduraPct!=null){const d=av.gorduraPct-pv.gorduraPct; if(Math.abs(d)>=.1)parts.push(`${d<0?'reduziu':'aumentou'} ${fmt(Math.abs(d))} ponto${Math.abs(d)>=2?'s':''} percentua${Math.abs(d)>=2?'is':'l'} de gordura`);}
  if(av.musculoPct!=null&&pv.musculoPct!=null){const d=av.musculoPct-pv.musculoPct; if(Math.abs(d)>=.1)parts.push(`${d>0?'ganhou':'perdeu'} ${fmt(Math.abs(d))} p.p. de músculo`);}
  let s=`${nm}, comparando com a avaliação de ${fdate(pv.data)} (${n} ${n===1?'dia':'dias'} atrás), você ${parts.length>1?parts.slice(0,-1).join(', ')+' e '+parts.slice(-1):parts[0]||'manteve os números estáveis'}.`;
  if(av.cintura!=null&&pv.cintura!=null&&Math.abs(av.cintura-pv.cintura)>=1){const d=av.cintura-pv.cintura;s+=` A cintura ${d<0?'diminuiu':'aumentou'} ${fmt(Math.abs(d),0)} cm.`;}
  if(ci)s+=` Seu IMC está na faixa “${ci[0]}”.`;
  return s;
}

  $('#bk').onclick=()=>go('aluno',{id:al.id}); $('#ed').onclick=()=>go('nova',{editId:av.id});

  $('#sug').onclick=()=>{const t=$('#concEd');t.value=(t.value.trim()?t.value.trim()+'\n\n':'')+autoText(av,al);t.focus();};
  $('#sv').onclick=async()=>{av.conclusao=$('#concEd').value.trim()||null;av.editadoEm=new Date().toISOString();await saveAll();toast('Texto salvo');render();};
  const fname=ext=>`Avaliacao_${al.nome.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}_${av.data}.${ext}`;
  async function shot(){ const pend=$('#concEd').value.trim(); if((pend||null)!==(av.conclusao||null)){av.conclusao=pend||null;await saveAll();render();}
    if(!window.html2canvas){toast('Carregando ferramenta de imagem…');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');}
    const el=$('#rpt'); const ne=el.querySelectorAll('[data-noexport]'); ne.forEach(x=>x.style.display='none');
    const prevW=el.style.width; el.style.width='420px'; el.style.maxWidth='420px';
    const c=await html2canvas(el,{scale:2.5,backgroundColor:'#ffffff',useCORS:true,logging:false});
    el.style.width=prevW; el.style.maxWidth=''; ne.forEach(x=>x.style.display='');
    return c; }
  $('#shImg').onclick=async()=>{try{const c=await shot();const b=await new Promise(r=>c.toBlob(r,'image/png'));await deliver(b,fname('png'),'image/png');}catch(e){toast('Não foi possível gerar a imagem (sem internet?).');}};
  $('#shPdf').onclick=async()=>{try{const c=await shot();if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const w=420,h=c.height/c.width*w;const pdf=new jspdf.jsPDF({unit:'pt',format:[w,h],orientation:'portrait'});pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,w,h);
    await deliver(pdf.output('blob'),fname('pdf'),'application/pdf');}catch(e){toast('Não foi possível gerar o PDF (sem internet?).');}};
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

async function vBackup(app){
  setTop('Backup e dados','');
  const snaps=(await store.keys()).filter(k=>String(k).startsWith('snap:')).sort().reverse();
  const pend=D.alunos.filter(a=>pendencias(a).length);
  const lb=META.lastBackup;
  app.innerHTML=`<div class="stack fade">
   ${META.demo?`<div class="banner warn"><div><b>Dados de exemplo.</b> Restaure o arquivo de backup da base real para começar a usar. Os exemplos serão substituídos.</div></div>`:''}
   <div class="card stack">
     <div class="sec-h"><h2 style="font-size:20px">Backup no OneDrive</h2><span class="tag ${META.demo?'n':!lb?'bad':META.changes?'warn':'ok'}">${META.demo?'exemplo':!lb?'nunca feito':META.changes?META.changes+' alteração(ões) sem backup':'em dia'}</span></div>
     <p class="muted small" style="margin:0">${lb?`Último backup: ${new Date(lb).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}.`:'Nenhum backup feito neste aparelho.'} A base completa tem ${D.alunos.length} alunos e ${D.avaliacoes.length} avaliações.</p>
     <p class="small" style="margin:0">Toque em <b>Fazer backup</b>, escolha <b>Salvar em Arquivos</b> e salve na pasta <b>OneDrive › Avaliações</b>. Cada backup é um arquivo com a data no nome, então os anteriores ficam guardados.</p>
     <button class="btn primary block" id="bkp">Fazer backup agora</button>
     <button class="btn block" id="xls">Exportar planilha Excel (.xlsx)</button>
   </div>
   <div class="card stack">
     <h2 style="font-size:20px">Restaurar a partir de um backup</h2>
     <p class="muted small" style="margin:0">Use ao trocar de aparelho ou para carregar a base migrada da planilha. Os dados atuais deste aparelho são substituídos (uma cópia local é guardada antes).</p>
     <button class="btn block" id="rst">Escolher arquivo de backup (.json)</button>
   </div>
   <div class="card stack">
     <div class="sec-h"><h2 style="font-size:20px">Proteção deste aparelho</h2><span class="tag ${persisted?'ok':'warn'}">${persisted?'armazenamento protegido':'armazenamento comum'}</span></div>
     <p class="muted small" style="margin:0">${persisted?'O navegador marcou estes dados como permanentes.':'Instale o app na tela de início (Compartilhar › Adicionar à Tela de Início) para o iPhone não apagar os dados por falta de uso. Mesmo assim, o backup é o que garante a base.'}</p>
   </div>
   ${pend.length?`<div class="card stack"><div class="sec-h"><h2 style="font-size:20px">Cadastros para completar</h2><span class="tag warn">${pend.length}</span></div>
     <p class="muted small" style="margin:0">Vieram da planilha sem data de nascimento, altura ou com telefone incompleto. Toque para corrigir.</p>
     <div class="list">${pend.slice(0,40).map(a=>`<button class="li" data-fixal="${a.id}"><span class="li-main"><b>${esc(a.nome)}</b><span>falta ${pendencias(a).join(', ')}</span></span><span class="muted">›</span></button>`).join('')}</div>${pend.length>40?`<p class="small muted" style="margin:0">Mais ${pend.length-40} na lista de alunos (filtro “Cadastro incompleto”).</p>`:''}</div>`:''}
   <div class="card stack">
     <h2 style="font-size:20px">Cópias locais automáticas</h2>
     <p class="muted small" style="margin:0">O app guarda neste aparelho uma cópia antes de cada restauração ou exclusão (as 8 mais recentes). Servem para desfazer um erro, não substituem o backup.</p>
     ${snaps.length?`<div class="list">${(await Promise.all(snaps.map(k=>store.get(k)))).map((s,i)=>s?`<button class="li" data-snap="${snaps[i]}"><span class="li-main"><b>${new Date(s.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</b><span>${esc(s.reason)} · ${s.data.avaliacoes.length} avaliações</span></span><span class="muted">Restaurar</span></button>`:'').join('')}</div>`:'<p class="small muted" style="margin:0">Nenhuma ainda.</p>'}
   </div>
   <div class="card stack">
     <h2 style="font-size:20px">Profissional</h2>
     <div class="fgroup"><div class="field"><label for="p-nome">Nome no relatório</label><input id="p-nome" value="${esc(D.config?.profissional||'')}"></div><div class="field"><label for="p-cref">CREF</label><input id="p-cref" value="${esc(D.config?.cref||'')}"></div></div>
     <button class="btn" id="psv">Salvar</button>
   </div>
  </div>`;
  $('#bkp').onclick=async()=>{ if(META.demo){toast('Restaure a base real antes de fazer backup.');return;}
    const out=Object.assign({},D,{app:APPKEY,schema:SCHEMA,exportadoEm:new Date().toISOString()});
    const ts=new Date();const p=n=>String(n).padStart(2,'0');
    const name=`Backup_Avaliacoes_${ts.getFullYear()}-${p(ts.getMonth()+1)}-${p(ts.getDate())}_${p(ts.getHours())}h${p(ts.getMinutes())}.json`;
    const ok=await deliver(new Blob([JSON.stringify(out)],{type:'application/json'}),name,'application/json');
    if(ok){META.lastBackup=new Date().toISOString();META.changes=0;await store.set('meta',META);toast('Backup gerado');render();}
  };
  $('#xls').onclick=async()=>{try{ if(!window.XLSX){toast('Carregando…');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');}
    const A=D.alunos.map(a=>({ID:a.id,Aluno:a.nome,Sexo:a.sexo,Nascimento:a.nascimento,Idade:idadeEm(a),'Altura (cm)':a.alturaCm,'Objetivo 1':a.objetivo1,'Objetivo 2':a.objetivo2,'Meta peso':a.metaPeso,'Meta gordura %':a.metaGordura,Telefone:a.telefone,'E-mail':a.email,Ativo:a.ativo!==false?'sim':'não'}));
    const V=D.avaliacoes.slice().sort((a,b)=>a.data<b.data?-1:1).map(v=>{const al=alunoById(v.alunoId)||{};const r={ID:v.id,'ID aluno':v.alunoId,Aluno:al.nome,Data:v.data,'Peso (kg)':v.peso,IMC:imcOf(v,al)?Math.round(imcOf(v,al)*10)/10:null,'Gordura %':v.gorduraPct,'Músculo esq. %':v.musculoPct,'Metab. basal (kcal)':v.metabolismo,'Idade corporal':v.idadeCorporal,'Gord. visceral (nível)':v.visceral};MED.forEach(m=>r[m.l+' (cm)']=v[m.k]);r['Percepção']=v.conclusao;return r;});
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(V),'Avaliacoes');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(A),'Alunos');
    const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});await deliver(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`Avaliacoes_${today()}.xlsx`,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }catch(e){toast('Não foi possível gerar a planilha (sem internet?).');}};
  $('#rst').onclick=()=>$('#fileIn').click();
  $('#psv').onclick=async()=>{D.config=Object.assign({},D.config,{profissional:$('#p-nome').value.trim(),cref:$('#p-cref').value.trim()});await saveAll();toast('Salvo');};
  app.querySelectorAll('[data-fixal]').forEach(b=>b.onclick=()=>go('cadastro',{id:b.dataset.fixal}));
  app.querySelectorAll('[data-snap]').forEach(b=>b.onclick=async()=>{const s=await store.get(b.dataset.snap);if(!s)return;if(await confirmSheet({title:'Restaurar cópia local?',body:`Volta a base para ${new Date(s.at).toLocaleString('pt-BR')} (${s.data.avaliacoes.length} avaliações). O estado atual vira outra cópia local.`,ok:'Restaurar'})){await snapshot('antes de restaurar cópia local');D=s.data;await saveAll();toast('Cópia restaurada');go('alunos');}});
}
$('#fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f)return;
  let obj; try{obj=JSON.parse(await f.text());}catch(_){toast('Arquivo inválido: não é um backup.');return;}
  if(!obj||obj.app!==APPKEY||!Array.isArray(obj.alunos)||!Array.isArray(obj.avaliacoes)){toast('Este arquivo não é um backup deste app.');return;}
  const lastD=obj.avaliacoes.reduce((m,v)=>v.data>m?v.data:m,'');
  if(await confirmSheet({title:'Restaurar este backup?',body:`<p><b>${esc(f.name)}</b><br>${obj.alunos.length} alunos · ${obj.avaliacoes.length} avaliações · avaliação mais recente em ${fdate(lastD)}${obj.exportadoEm?` · gerado em ${new Date(obj.exportadoEm).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}`:''}</p><p>Os dados atuais deste aparelho (${D.avaliacoes.length} avaliações${META.demo?', de exemplo':''}) serão substituídos.</p>`,ok:'Restaurar'})){
    if(!META.demo)await snapshot('antes de restaurar backup');

    META={lastBackup:obj.exportadoEm||new Date().toISOString(),changes:0,demo:false}; await store.set('db',D); await store.set('meta',META);
    toast('Backup restaurado'); go('alunos');
  }
});
